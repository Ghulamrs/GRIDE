<svg xmlns="http://www.w3.org/2000/svg" width="680" height="560" viewBox="0 0 680 560" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>GRIDE.sln dependency tree</title>
<desc>GRIDE, the startup project, depends on all eleven tool projects grouped as Compilers, TI and Windows. shc depends on cxx1; rts6x depends on cxx1, asm6x and shc. Everything builds into x64\config beside GRIDE.sln.</desc>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <marker id="c" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#D85A30" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
  <style>
    .h { font-size: 14px; font-weight: 600; }
    .s { font-size: 12px; }
    .tool rect { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 0.6; }
    .tool .h { fill: #085041; } .tool .s { fill: #0F6E56; }
    .group { fill: #F8F7F3; stroke: #888780; stroke-width: 0.6; stroke-dasharray: 4 3; }
    .gt { fill: #2C2C2A; }
    .wire { stroke: #5F5E5A; stroke-width: 0.8; fill: none; }
    .dep { stroke: #D85A30; stroke-width: 1.3; fill: none; }
  </style>
</defs>
